name: Backtest estrategia 4H

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agentes/backtest4h.py", ".github/workflows/backtest.yml"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Backtest
        run: python agentes/backtest4h.py
      - name: Guardar resultado
        run: |
          git config user.name "Mesa GSAM"
          git config user.email "mesa@users.noreply.github.com"
          git add data/backtest_4h.json
          git diff --cached --quiet && exit 0
          git commit -q -m "[backtest] estrategia 4H"
          for i in 1 2 3 4; do git push -q && exit 0; git pull --rebase -q; sleep 3; done
