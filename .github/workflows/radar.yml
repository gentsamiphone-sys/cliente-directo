name: Mesa de memecoins

# Cada 5 minutos (lo más rápido que permite GitHub gratis; a veces se atrasa)
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memes
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r agentes/requirements.txt
      - name: Vigilar wallets top
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/memes.html
        run: |
          git config user.name "Mesa memecoins"
          git config user.email "memes@users.noreply.github.com"
          python agentes/memes.py
# solo wallets que Gent sigue en fomo
