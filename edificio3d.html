#btns{position:fixed;right:14px;bottom:14px;z-index:5;display:flex;gap:8px}

function golpe(t,tipo){const c=MU.ctx;if(tipo==="bombo"){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(MU.out);o.start(t);o.stop(t+.32)}
  else{const b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="highpass";f.frequency.value=7000;g.gain.value=tipo==="plato"?.18:.09;s.connect(f).connect(g).connect(MU.out);s.start(t)}}
function programar(){const c=MU.ctx,neg=60/84/2;while(MU.prox<c.currentTime+.25){const t=MU.prox,k=MU.paso%32,ac=ACORDES[Math.floor(MU.paso/32)%4];
  if(k===0)ac.forEach(n=>nota(hz(n+12),t,neg*32,"sawtooth",.06,1800));if(k%16===0)nota(hz(ac[0]-12),t,neg*7,"triangle",.3,900);if(k%16===10)nota(hz(ac[0]-12),t,neg*4,"triangle",.22,900);
  if(k%8===0)golpe(t,"bombo");if(k%8===4)golpe(t,"plato");if(k%2===1)golpe(t,"hat");if([0,3,6,10,12,14].includes(k%16)&&Math.random()<.7)nota(hz(ac[(k/2|0)%4]+12),t,neg*1.5,"triangle",.14,3200);
  MU.prox+=neg;MU.paso++}}
function musica(on,guardar=true){MUSICA=on;if(guardar)try{localStorage.setItem("gsam_musica",on?"1":"0")}catch{};$("musica").classList.toggle("off",!on);
  if(on){if(!MU.ctx){try{MU.ctx=new (window.AudioContext||window.webkitAudioContext)();try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch{};MU.out=MU.ctx.createGain();MU.out.gain.value=.0001;
      const cp=MU.ctx.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;MU.cp=cp;MU.out.connect(cp).connect(MU.ctx.destination)}catch{return}}
    MU.ctx.resume();MU.out.gain.cancelScheduledValues(MU.ctx.currentTime);MU.out.gain.setTargetAtTime(.9,MU.ctx.currentTime,.3);if(!MU.tm){MU.prox=MU.ctx.currentTime+.1;MU.tm=setInterval(programar,100)}}
  else if(MU.ctx){MU.out.gain.setTargetAtTime(.0001,MU.ctx.currentTime,.4);setTimeout(()=>{if(!MUSICA&&MU.tm){clearInterval(MU.tm);MU.tm=null}},1500)}}
$("musica").classList.toggle("off",!MUSICA);$("musica").onclick=()=>musica(!MUSICA);
if(MUSICA)addEventListener("pointerdown",function f(){removeEventListener("pointerdown",f);if(MUSICA)musica(true,false)},{passive:true});
$("rotar").onclick=()=>{ctl.autoRotate=!ctl.autoRotate;$("rotar").classList.toggle("off",!ctl.autoRotate)};$("rotar").classList.toggle("off",!ctl.autoRotate);
ren.domElement.addEventListener("pointerdown",()=>{ctl.autoRotate=false;$("rotar").classList.add("off")},{passive:true});

/* ---------- recorrido de bienvenida ---------- */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z),PY=i=>.7+PISOS[i].y0+PISOS[i].h*.5;
const resumen=()=>{const s=EST&&EST.total;return s?`${s.r_total>=0?"+":""}${Number(s.r_total).toFixed(1)}R · ${s.acierto_pct}% de acierto en ${s.operaciones} trades`:"Cada trade queda registrado y auditado"};
const TOUR=[
  {p:V3(34,46,36),t:V3(0,16,0),d:3.4,txt:()=>["GSAM Capital","Una mesa de trading operada por agentes de IA"]},
  {p:V3(12,6,34),t:V3(0,4,10),d:3,txt:()=>["El lobby","Aquí entran los miembros de GSAM Señales"]},
  {p:V3(15,PY(1)+2,27),t:V3(0,PY(1),2),d:2.6,txt:()=>["Piso 1 · Noticias, Macro y Auditor","Leen el calendario y las noticias cada 10 minutos"]},
  {p:V3(-15,PY(2)+2,27),t:V3(0,PY(2),2),d:2.6,txt:()=>["Piso 2 · Flujos y Liquidez","Siguen el dinero institucional y el COT"]},
  {p:V3(15,PY(3)+2,27),t:V3(0,PY(3),2),d:2.6,txt:()=>["Piso 3 · Riesgo, Historiador y Ejecución","Riesgo fijo, stop institucional, R:R mínimo 2"]},
  {p:V3(12,PY(4)+2,24),t:V3(0,PY(4),2),d:3.2,txt:()=>["Piso 4 · Sala de Trading","Oro y NQ en vivo, con briefs antes de Asia, Londres y NY"]},
  {p:V3(-14,PY(5)+3,24),t:V3(0,PY(5),2),d:2.6,txt:()=>["Penthouse · Oficina del CIO","El CIO aprueba cada entrada"]},
  {p:V3(36,14,12),t:V3(11,13.5,2.4),d:3.6,txt:()=>["Resultados reales",resumen()]},
  {p:V3(-30,46,40),t:V3(0,31,0),d:3.2,txt:()=>["Únete a GSAM Señales","Entradas de la mesa en tu Telegram · en Whop"]},
];
let TR=null;
function mostrarCap(a){const c=$("cap");c.innerHTML=`${a[0]}<small>${a[1]}</small>`;c.classList.add("on")}
function iniciarTour(lista=TOUR,bucle=false){ctl.enabled=false;ctl.autoRotate=false;$("rotar").classList.add("off");TR={lista,bucle,i:0,t0:performance.now(),fp:cam.position.clone(),ft:ctl.target.clone()};TR.txt=lista[0].txt();mostrarCap(TR.txt)}
function pasoTour(now){const k=TR.lista[TR.i],tr=k.tr||k.d*.5,el=(now-TR.t0)/1000,e=CL(el/tr),s=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2,hold=CL((el-tr)/Math.max(.1,k.d-tr));
  // vuelo en coordenadas cilíndricas alrededor de la torre: nunca atraviesa los edificios de la ciudad
  const cil=v=>({r:Math.hypot(v.x,v.z-2),a:Math.atan2(v.z-2,v.x),y:v.y}),A=cil(TR.fp),B=cil(k.p);let da=B.a-A.a;da=Math.atan2(Math.sin(da),Math.cos(da));
  const rr=A.r+(B.r-A.r)*s,aa=A.a+da*s+(hold>0?hold*(k.dr||1.6)/Math.max(8,B.r):0);cam.position.set(Math.cos(aa)*rr,A.y+(B.y-A.y)*s,2+Math.sin(aa)*rr);ctl.target.lerpVectors(TR.ft,k.t,s);
  cam.lookAt(ctl.target);
  if(el>k.d){TR.i++;if(TR.i>=TR.lista.length){if(TR.bucle)TR.i=0;else{finTour();return}}TR.t0=now;TR.fp=cam.position.clone();TR.ft=ctl.target.clone();TR.txt=TR.lista[TR.i].txt();mostrarCap(TR.txt)}}
function finTour(){TR=null;ctl.enabled=true;$("cap").classList.remove("on");try{localStorage.setItem("gsam_tour","1")}catch{};if(REC.on)pararRec();if(DIRECTO)setTimeout(()=>{if(!TR)iniciarTour(DIRECTOR,true)},200)}
$("tour").onclick=e=>{e.stopPropagation();if(TR&&!REC.on)finTour();else if(!REC.on)iniciarTour()};
ren.domElement.addEventListener("pointerdown",()=>{if(TR&&!REC.on&&!DIRECTO)finTour()},{passive:true});
setTimeout(()=>{let visto=false;try{visto=localStorage.getItem("gsam_tour")==="1"}catch{}if(!visto&&!TR&&!DIRECTO)iniciarTour()},2200);

/* ---------- modo directo (Kick / OBS): pantalla limpia, cámaras automáticas, alertas y cintillo ---------- */
const QS=new URLSearchParams(location.search);let DIRECTO=QS.has("directo");
const ultNoticia=()=>{const n=(M_ULT?.noticias||[]).find(x=>x.impacto==="alto");return n?String(n.es||n.titulo):"Sin noticias de alto impacto por ahora"};
const DIRECTOR=[
  {p:V3(34,44,36),t:V3(0,16,0),d:22,tr:6,dr:14,txt:()=>["GSAM Capital · en vivo","Agentes de IA analizando oro y NQ las 24 horas"]},
  {p:V3(13,PY(4)+2.5,25),t:V3(0,PY(4),2),d:20,tr:5,dr:5,txt:()=>["Sala de Trading","Oro "+fmt(VIVO.oro,1)+" · NQ "+fmt(VIVO.nq)+" · VIX "+fmt(VIVO.vix,2)]},
  {p:V3(36,14,12),t:V3(11,13.5,2.4),d:18,tr:5,dr:3,txt:()=>["Resultados reales de la mesa",resumen()]},
  {p:V3(-16,PY(1)+2,26),t:V3(0,PY(1),2),d:18,tr:5,dr:5,txt:()=>["Noticias de alto impacto",ultNoticia()]},
  {p:V3(-16,37,24),t:V3(-6,31.5,6),d:16,tr:5,dr:4,txt:()=>["Azotea GSAM","Helipuerto y letrero de la torre"]},
  {p:V3(10,4,40),t:V3(0,2,18),d:18,tr:5,dr:6,txt:()=>[D.estado==="dentro"?"Gent Sam está en la oficina":"Gent Sam salió en su Maybach",$("dueno").textContent.replace(/^\S+\s/,"")]},
  {p:V3(-34,30,-32),t:V3(0,14,0),d:20,tr:6,dr:12,txt:()=>["Únete a GSAM Señales","Las entradas de la mesa en tu Telegram · en Whop"]},
];
const TRADING=[{p:V3(11,PY(4)+2.2,22),t:V3(0,PY(4),2),d:14,tr:3,dr:2,txt:()=>ALERTA_TXT}];let ALERTA_TXT=["",""];
let M_ULT=null,VISTO=null,AC=null;
const RX_EV=/(COMPRADO|cerrada en|Idea de COMPRA|Ruptura y retesteo|Vela de desplazamiento ·|\[DEMO\]|dentro a)/;
function tipoEv(x){return /(objetivo|TP).{0,25}(alcanz|toc|lleg)|ganad/i.test(x)?"gana":/stop.{0,25}(toc|salt|lleg)|perdid/i.test(x)?"pierde":/cerrada en breakeven/.test(x)?"be":/VENTA/.test(x)?"venta":"compra"}
function tituloEv(tp,x){const a=(x.match(/\b(NQ|MNQ|ORO|MGC|GC)\b/)||[,""])[1];return{gana:"🏆 OBJETIVO ALCANZADO "+a,pierde:"🛑 STOP "+a,be:"⚖️ BREAKEVEN "+a,venta:"🔴 VENTA "+a,compra:"🟢 COMPRA "+a}[tp]}
function pitido(tipo){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();const notas={compra:[660,880],venta:[520,390],gana:[660,880,1320],pierde:[300,220],be:[500,500]}[tipo]||[660];
  notas.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.18;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.37)})}catch{}}
function alertaTrade(tipo,titulo,detalle){const a=$("alerta");a.className="on "+tipo;a.innerHTML=`${titulo}<small>${detalle.replace(/[<>&]/g,"")}</small>`;clearTimeout(alertaTrade.tm);alertaTrade.tm=setTimeout(()=>a.className="",12000);
  pitido(tipo);const col={compra:0x3fd68b,venta:0xff5b5b,gana:0xd7ff3a,pierde:0xff3b3b,be:0xc9cfc6}[tipo]||ACC;M_LED.color.setHex(col);clearTimeout(alertaTrade.led);alertaTrade.led=setTimeout(()=>M_LED.color.setHex(ACC),15000);
  ALERTA_TXT=[titulo,detalle.slice(0,110)];if(DIRECTO||TR){iniciarTour(TRADING,false)}}
function revisarEventos(M){const evs=(M.actividad||[]).filter(a=>(a.agente==="ejecucion"||a.agente==="auditor")&&RX_EV.test(a.texto)&&!/No se|no se|pero|Error|error/.test(a.texto));if(!evs.length)return;
  if(VISTO===null){VISTO=evs[0].ts;return}const nu=evs.filter(a=>a.ts>VISTO);if(!nu.length)return;VISTO=nu[0].ts;const x=nu[0].texto.replace(/\[SIMULADO\] |\[DEMO\] /g,""),tp=tipoEv(x);alertaTrade(tp,tituloEv(tp,x),x)}
function cinta(M){const b=(M.briefs||[])[0]||{},sg=b.sesgo||{},s=M.estadisticas?.total,N=(M.noticias||[]).filter(n=>n.impacto!=="bajo").slice(0,8);
  const partes=[`<i>ORO</i>${fmt(VIVO.oro,1)}`,`<i>NQ</i>${fmt(VIVO.nq)}`,`<i>VIX</i>${fmt(VIVO.vix,2)}`,sg.oro?`<i>SESGO ORO</i>${String(sg.oro).toUpperCase()}`:"",sg.nq?`<i>SESGO NQ</i>${String(sg.nq).toUpperCase()}`:"",
    s?`<i>MESA</i>${s.r_total>=0?"+":""}${Number(s.r_total).toFixed(1)}R · ${s.acierto_pct}% acierto`:"",...N.map(n=>`<span class="${n.impacto==="alto"?"alto":""}">📰 ${String(n.es||n.titulo).replace(/[<>&]/g,"")}</span>`),"<i>GSAM SEÑALES</i>únete en Whop"].filter(Boolean);
  $("cintaTxt").innerHTML=partes.join('<i>◆</i>')}
function relojDirecto(){const s=sesionAhora(),p=proximaSesion();$("vivoTxt").textContent=`Las Vegas ${new Date().toLocaleTimeString("es-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"2-digit"})} · `+(s?`Sesión de ${s.n} en curso`:`Próxima sesión: ${p.n} a las ${hTxt(p.ini)}`)}
function activarDirecto(){DIRECTO=true;document.body.classList.add("directo");lab.domElement.style.display="none";relojDirecto();setInterval(relojDirecto,20000);
  if(M_ULT)cinta(M_ULT);iniciarTour(DIRECTOR,true);musica(true,false);setTimeout(()=>location.reload(),6*3600*1000)}
$("directo").onclick=e=>{e.stopPropagation();const u=new URL(location.href);u.searchParams.set("directo","1");location.href=u.toString()};

/* ---------- modo video: graba el recorrido en vertical (9:16) para reels ---------- */
const REC={on:false};const RW=720,RH=1280;
function tipoVideo(){if(!window.MediaRecorder)return null;for(const m of["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"])if(MediaRecorder.isTypeSupported(m))return m;return null}
function grabar(){const mime=tipoVideo(),c=document.createElement("canvas");if(!mime||!c.captureStream){mostrarCap(["No se puede grabar aquí","Prueba en Chrome de computadora"]);setTimeout(()=>$("cap").classList.remove("on"),4000);return}
  c.width=RW;c.height=RH;REC.cv=c;REC.g=c.getContext("2d");REC.pr=ren.getPixelRatio();
  ren.setPixelRatio(1);ren.setSize(RW,RH,false);Object.assign(ren.domElement.style,{width:Math.round(H()*RW/RH)+"px",height:H()+"px"});cam.aspect=RW/RH;cam.fov=58;cam.updateProjectionMatrix();
  const st=c.captureStream(30);
  if(MUSICA&&MU.ctx&&MU.cp){if(!MU.dest){MU.dest=MU.ctx.createMediaStreamDestination();MU.cp.connect(MU.dest)}MU.dest.stream.getAudioTracks().forEach(tr=>st.addTrack(tr))}
  REC.chunks=[];REC.mime=mime;REC.mr=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:8e6});REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};REC.mr.onstop=bajarVideo;
  REC.mr.start(250);REC.on=true;lab.domElement.style.display="none";document.body.classList.add("grabando");$("video").textContent="⏹️";iniciarTour()}
function pararRec(){if(!REC.on)return;REC.on=false;lab.domElement.style.display="";try{REC.mr.stop()}catch{}document.body.classList.remove("grabando");$("video").textContent="🎬";
  ren.setPixelRatio(REC.pr);ren.setSize(W(),H());cam.aspect=W()/H();cam.fov=40;cam.updateProjectionMatrix();if(TR)finTour()}
function bajarVideo(){const ext=REC.mime.includes("mp4")?"mp4":"webm",b=new Blob(REC.chunks,{type:REC.mime.split(";")[0]}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`gsam-capital-edificio.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  mostrarCap(["Video listo ✅",ext==="mp4"?"Se descargó en MP4, listo para tus reels":"Se descargó en WEBM; si Facebook no lo acepta, conviértelo a MP4"]);setTimeout(()=>$("cap").classList.remove("on"),6000)}
function cuadroVideo(){const g=REC.g;g.drawImage(ren.domElement,0,0,RW,RH);
  // marca arriba
  g.fillStyle="rgba(11,13,16,.78)";g.fillRect(0,0,RW,118);g.fillStyle="#d7ff3a";g.fillRect(0,116,RW,4);
  g.save();logo(g,RW,84,54);g.restore();g.textBaseline="alphabetic";g.textAlign="center";g.font='700 22px "IBM Plex Mono",monospace';g.fillStyle="#8a948c";g.fillText("MESA DE TRADING CON AGENTES DE IA",RW/2,104);
  // subtítulo del recorrido
  if(TR&&TR.txt){const[a,b]=TR.txt;g.font='800 46px "Familjen Grotesk",Arial';const lines=partir(g,a,RW-110);g.font='600 28px "Atkinson Hyperlegible",Arial';const lb=partir(g,b,RW-110);
    const hh=40+lines.length*52+lb.length*36,y0=RH-170-hh;g.fillStyle="rgba(11,13,16,.88)";redondo(g,40,y0,RW-80,hh,22);g.fill();g.strokeStyle="#d7ff3a";g.lineWidth=3;g.stroke();
    g.font='800 46px "Familjen Grotesk",Arial';g.fillStyle="#f4f7ee";lines.forEach((l,i)=>g.fillText(l,RW/2,y0+62+i*52));
    g.font='600 28px "Atkinson Hyperlegible",Arial';g.fillStyle="#c8d0c4";lb.forEach((l,i)=>g.fillText(l,RW/2,y0+62+lines.length*52+i*36))}
  g.fillStyle="#d7ff3a";g.font='700 26px "IBM Plex Mono",monospace';g.fillText(`ORO ${fmt(VIVO.oro,1)} · NQ ${fmt(VIVO.nq)} · VIX ${fmt(VIVO.vix,2)}`,RW/2,RH-60);g.textAlign="left"}
function partir(g,t,mx){const w=String(t).split(" "),o=[];let l="";for(const p of w){const n=l?l+" "+p:p;if(g.measureText(n).width>mx&&l){o.push(l);l=p}else l=n}if(l)o.push(l);return o}
function redondo(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
$("video").onclick=e=>{e.stopPropagation();REC.on?pararRec():grabar()};

/* ---------- animación ---------- */
const clk=new THREE.Clock();let tMarc=-9;
function loop(){const t=clk.getElapsedTime(),dt=Math.min(.05,t-(loop.tp??t));loop.tp=t;moverHeli(performance.now(),dt);moverDueno(dt,t);
  if(!reduce){for(const a of AUTOS){a.p+=a.v;a.ruedas.forEach(w=>w.rotation.z-=Math.abs(a.v)/a.P.r);if(a.p>380)a.p=-380;if(a.p<-380)a.p=380;if(a.eje){a.g.position.set(a.linea,0,a.p);a.g.rotation.y=a.s>0?-Math.PI/2:Math.PI/2}else{a.g.position.set(a.p,0,a.linea);a.g.rotation.y=a.s>0?0:Math.PI}}
    for(const p of GENTE){p.cab.rotation.y=Math.sin(t*.5+p.ph)*.35;p.g.position.y=Math.abs(Math.sin(t*1.2+p.ph))*.01}
    for(const b of BANDERAS){const pa=b.f.geometry.attributes.position,a=pa.array;for(let i=0;i<a.length;i+=3){const x=b.base[i];a[i+2]=Math.sin(x*2.4-t*4+b.ph)*.18*(x/2.2)}pa.needsUpdate=true}
    if(Math.floor(t*10)%25===0)PANT.forEach((m,i)=>{if(Math.random()<.08)m.color.setHex(Math.random()<.6?ACC:0xff6b5b)})}
  FARO.material.color.setHex(Math.floor(t*1.4)%2?0xff3b30:0x4a1210);
  if(t-tMarc>1){tMarc=t;dibMarcador(t)}
  if(TR)pasoTour(performance.now());else ctl.update();ren.render(sc,cam);if(REC.on)cuadroVideo();if(!REC.on)lab.render(sc,cam);requestAnimationFrame(loop)}
loop();
if(DIRECTO)setTimeout(activarDirecto,1500);
addEventListener("resize",()=>{if(REC.on)return;cam.aspect=W()/H();cam.updateProjectionMatrix();ren.setSize(W(),H());lab.setSize(W(),H())});
